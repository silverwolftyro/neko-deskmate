[plugin]
id = "agent_deskmate"
name = "同桌猫"
description = "替你看着本机的编码 Agent（Claude Code / Codex / mcode）：在需要审批、完成、出错、卡住时按你可调的强度播报与解释，并在 N.E.K.O 里完成同意/拒绝，不必切进 Agent 界面。基本版只接 Claude Code。"
version = "0.3.1"
type = "plugin"
entry = "plugin.plugins.agent_deskmate:AgentDeskmatePlugin"

# passive = true：只监听，不参与 Agent 任务分派（决策 D2）。
# 注意 passive 不阻止进程启动，也不阻止播报——push_message 是出口，不是入口。
passive = true

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"
