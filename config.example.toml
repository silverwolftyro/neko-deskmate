# 同桌猫（agent_deskmate）出厂默认配置
#
# 宿主会把这些默认值写进用户配置副本（<用户数据>/plugins/agent_deskmate/config/），
# 用户在插件管理器里改的是那份副本，不是这个文件。所以这里只放"出厂默认值"。
#
# 约定：每个键都必须被代码真正读取，并且有一个"改了它行为就变"的测试。
# 不要制造清单里声明、代码里零命中 的死配置键。

[plugin_runtime]
enabled = true
# 手动启动：首次安装不自动跑，等用户在插件管理器里单独批准（决策 D2）。
auto_start = false

[agent_deskmate]
# L0 规则层：同一事件在该秒数内合并成一条播报（防刷屏）。
coalesce_seconds = 60

# 播报正文是否原样写进插件日志。
#   true  = 写，但写之前先脱敏（-p<密码>、--token/--api-key 的值、password=、
#           api_key=、sk-…、Bearer … 一律打成 ***）
#   false = 只写「命令长度 + 前 40 字」（照样先脱敏）
# 聊天窗里给人看的永远是原文——打码只针对落盘日志。
log_commands = true

# 审批中继（M0-lite-5）：本地 HTTP 服务监听端口，只绑 127.0.0.1。
# 改这个值必须同时改 hooks.json 里的 url，否则 Claude Code 的
# PermissionRequest hook 打不到插件（启动时若发现两边不一致会打错误日志）。
approval_port = 48921

# 审批等待上限（秒）。超时按"拒绝"回填——审批类交互宁可慢一步，
# 也不能无人点击就一直挂着。Claude Code 的 hook 默认超时是 600s，
# 所以这个值要明显小于 600。
approval_timeout_seconds = 60

# 停滞判定：同一会话超过该分钟数没有新事件且未结束，报一次。
stall_minutes = 10

# ── 观测源路径 ────────────────────────────────────────────────────────────
# 代码里不写死绝对路径（AGENTS.md 硬约束 6），只 expanduser / expandvars。
# 改了这两项就改变插件看哪里；换机器或换 Agent 安装位置时只动这里。
[agent_deskmate.watch]
# Claude Code 转录目录（**/*.jsonl，一行一条记录）
claude_projects_dir = "~/.claude/projects"
# cc-switch 网关账本（SQLite，proxy_request_logs 表，只读打开）
cc_switch_db = "~/.cc-switch/cc-switch.db"

# ── 归因逃生口 ─────────────────────────────────────────────────────────────
# 你亲自在这些目录下开过的会话。cwd 落在里面的，播报主语写成
# 「你自己开的 Claude Code」；不在里面的，critical 一律写成「发起者未知」。
#
# 为什么需要它：插件看不出一个 claude 进程是你手开的、还是被别的程序
# spawn 的（真实事故：DSH spawn 的 claude -p 删了文件，播报被读成
# "我什么时候让 Claude 删东西了"）。进程树不能当依据——Windows 上父进程
# 可能已退出、中间常隔一层 shell/node。
# 所以这里要**你自己声明**：这是用户给的事实，不是插件的猜测。
# 不声明 = 全部按未知处理（宁可少说，不错说）。
# 留空时插件启动会在日志里打一条提示（只在日志，不播报）。
[agent_deskmate.mine]
roots = []
# 示例（TOML 里反斜杠要转义，写两个）：
# roots = ["D:\\workspace", "C:\\Users\\alpha\\projects"]
# 也可以直接用正斜杠，Windows 同样认：
# roots = ["D:/workspace", "C:/Users/alpha/projects"]
