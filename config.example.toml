# 同桌猫（agent_deskmate）出厂默认配置
#
# 宿主会把这些默认值写进用户配置副本（<用户数据>/plugins/agent_deskmate/config/），
# 用户在插件管理器里改的是那份副本，不是这个文件。所以这里只放"出厂默认值"。
#
# 约定：每个键都必须被代码真正读取，并且有一个"改了它行为就变"的测试。
# 不要制造清单里声明、代码里零命中 的死配置键。

[plugin_runtime]
enabled = true
# 手动启动：首次安装不自动跑，等用户在插件管理器里单独批准（决策 D2）。
auto_start = false

[agent_deskmate]
# L0 规则层：同一事件在该秒数内合并成一条播报（防刷屏）。
coalesce_seconds = 60

# 播报正文是否原样写进插件日志。
#   true  = 写，但写之前先脱敏（-p<密码>、--token/--api-key 的值、password=、
#           api_key=、sk-…、Bearer … 一律打成 ***）
#   false = 只写「命令长度 + 前 40 字」（照样先脱敏）
# 聊天窗里给人看的永远是原文——打码只针对落盘日志。
log_commands = true


# 停滞判定：同一会话超过该分钟数没有新事件且未结束，报一次。
stall_minutes = 10

# ── 观测源路径 ────────────────────────────────────────────────────────────
# 代码里不写死绝对路径（AGENTS.md 硬约束 6），只 expanduser / expandvars。
# 改了这两项就改变插件看哪里；换机器或换 Agent 安装位置时只动这里。
[agent_deskmate.watch]
# Claude Code 转录目录（**/*.jsonl，一行一条记录）
claude_projects_dir = "~/.claude/projects"
# cc-switch 网关账本（SQLite，proxy_request_logs 表，只读打开）
cc_switch_db = "~/.cc-switch/cc-switch.db"

# ── 归因逃生口 ─────────────────────────────────────────────────────────────
# 你亲自在这些目录下开过的会话。cwd 落在里面的，播报主语写成
# 「你自己开的 Claude Code」；不在里面的，critical 一律写成「发起者未知」。
#
# 为什么需要它：插件看不出一个 claude 进程是你手开的、还是被别的程序
# spawn 的（真实事故：DSH spawn 的 claude -p 删了文件，播报被读成
# "我什么时候让 Claude 删东西了"）。进程树不能当依据——Windows 上父进程
# 可能已退出、中间常隔一层 shell/node。
# 所以这里要**你自己声明**：这是用户给的事实，不是插件的猜测。
# 不声明 = 全部按未知处理（宁可少说，不错说）。
# 留空时插件启动会在日志里打一条提示（只在日志，不播报）。
[agent_deskmate.mine]
roots = []
# 示例（TOML 里反斜杠要转义，写两个）：
# roots = ["D:\\workspace", "C:\\Users\\alpha\\projects"]
# 也可以直接用正斜杠，Windows 同样认：
# roots = ["D:/workspace", "C:/Users/alpha/projects"]

# ── 审批中继（三层门控 + 显式授权，规格《审批自动化-授权层级》§5） ───────────
# L0 转发：无任何配置即可用——只转发审批、常驻提醒未决，不解释不判断。
# L1 建议：ai_judgement=true **且** api_key 非空 **且** 用户已在授权入口确认。
# L2 自动：L1 三条 + auto_decide="low_risk_only" + 风险 ≤ 阈值才生效；
#          删除类/危险写**永远不进 L2**，无论阈值怎么设。
# 任何一层都不能跳级：L2 必须建立在 L1 之上——没解释能力的自动决定是黑箱代办。
#
# **三条硬规则（2026-11-21 定稿，覆盖此前实现）：**
#   1. 到期什么都不做——不拒绝、不回填、不记成"已拒绝"，响应体里不得出现
#      hookSpecificOutput；文案只写「宿主已自行处理，本插件未做判断」。
#   2. 没有显式授权，不执行任何明确操作——光写配置不够，还必须调用
#      approval_authorize 让用户确认授权文案（模型判断可能出错，决定由你
#      授权并承担后果），确认记录写进审计（时间、范围、授权版本）。
#      插件没有任何方法能在运行期自行打开授权。
#   3. 高风险永远呈现——critical / 删除类 / 危险写：卡片标红 + 等人，
#      任何阈值都不进自动分支；L2 只 auto-allow 低风险（notice 及以下），
#      **永不 auto-deny**。
#   L2 的时机是**事件发生那一刻**，不等 570 秒；自动放行后发一条 blind 通知
#   + 写一条含授权人/规则/模型/理由的审计。
[agent_deskmate.approval]
# 本地 HTTP 服务监听端口，只绑 127.0.0.1。
# 改它之后必须重跑一次 hook_install 入口——装进 Claude Code settings 的那条
# command hook 里写死了端口，不一致时启动会打错误日志（否则症状是
# "插件没反应"，能查一小时）。
port = 48921

# 到期标记（秒）。默认 570 = hook 600s 前留 30s 余量。
# **只标记 expired，不发任何 decision、不记成拒绝**——不自动允许、不自动拒绝。
timeout_mark_expired = 570

# 到期记录的保留时长（秒）。过期不删，保留这段时间供 pending_list 事后查。
retention_seconds = 3600

# L1：填了 api_key 之后，由用户显式打开。默认关。
# 只能由用户手写，插件不会在运行时自动打开它。
# 注意：光把它设成 true 还不够——还要调用 approval_authorize 签字。
ai_judgement = false

# L2："off" | "low_risk_only"。默认 off。
# 同样只能由用户手写，且同样需要授权确认。
auto_decide = "off"

# L2 风险阈值：info | notice | warn | critical。超出即回落为 L1（只建议不代决）。
# 调到 critical 也不会放行删除类——那是规则级排除，不是阈值问题。
auto_decide_max_severity = "notice"

# 「这是什么」讲多细：brief（只讲结论与最坏结果）|
# standard（加上范围与规则判据，默认）| detailed（再叠加模型给的理由与依据）。
explain_verbosity = "standard"

# 高风险警示的强调程度：first_n（默认）| always | never。
# 高危卡片上原来每条都顶一整行红字。真机反馈：前几次有用，之后价值像反比
# 函数一样暴跌——看多了就等于没有，真到该被叫住的那一刻也被一起跳过。
#   first_n  同一类操作的前 warning_first_n 次显示整行红字，之后缩成徽标「⚠ 高风险」
#   always   每次都显示整行红字
#   never    永远只显示徽标
# **这只改变警示长什么样，不改变行为**：高危操作照样永不自动放行、照样必须人点。
warning_emphasis = "first_n"

# first_n 档下，整行红字显示几次（同一类操作计）。
warning_first_n = 3

# 模型用的 key。只用来判断"有没有 key"，**不写日志、不进卡片、不给模型看**。
# 5b 起真正被使用；见下面 [agent_deskmate.model]。
api_key = ""

# ── 模型建议（5b 最小版） ─────────────────────────────────────────────────
# 四个字段，**不写死供应商**：protocol 只有 openai / anthropic 两种请求形状，
# base_url 指向哪里是用户的事。默认值是 DeepSeek 官方，只因为本机现成有 key。
#
# 硬约束（规格 §8，不是配置项）：
#   - 模型**只给建议，永不代决**——它的输出只填卡片的「建议 + 理由」两块，
#     没有任何路径能通向回给 Claude Code 的 allow/deny；
#   - L1 仍要求 ai_judgement=true **且**用户在 approval_authorize 入口签过字；
#   - 只把「工具名 + 命令 + 工作目录 + 风险档」发给模型，不发会话历史；
#   - 超时 15s、temperature 0、max_tokens 300，全部写死在代码里。
[agent_deskmate.model]
# 请求形状：openai（/chat/completions）| anthropic（/v1/messages）
protocol = "openai"
# 接口根地址，末尾不带 /v1 或 /chat/completions
base_url = "https://api.deepseek.com"
# 与上面 approval.api_key 等价；这里优先，为空时回退到那一处
api_key = ""
# 模型名
model = "deepseek-chat"
