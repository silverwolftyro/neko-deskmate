# 同桌猫（agent_deskmate）出厂默认配置
#
# 宿主会把这些默认值写进用户配置副本（<用户数据>/plugins/agent_deskmate/config/），
# 用户在插件管理器里改的是那份副本，不是这个文件。所以这里只放"出厂默认值"。
#
# 约定：每个键都必须被代码真正读取，并且有一个"改了它行为就变"的测试。
# 不要制造清单里声明、代码里零命中 的死配置键。

[plugin_runtime]
enabled = true
# 手动启动：首次安装不自动跑，等用户在插件管理器里单独批准（决策 D2）。
auto_start = false

[agent_deskmate]
# L0 规则层：同一事件在该秒数内合并成一条播报（防刷屏）。
coalesce_seconds = 60

# 播报正文是否原样写进插件日志。
#   true  = 写，但写之前先脱敏（-p<密码>、--token/--api-key 的值、password=、
#           api_key=、sk-…、Bearer … 一律打成 ***）
#   false = 只写「命令长度 + 前 40 字」（照样先脱敏）
# 聊天窗里给人看的永远是原文——打码只针对落盘日志。
log_commands = true


# 停滞判定：同一会话超过该分钟数没有新事件且未结束，报一次。
stall_minutes = 10

# ── 观测源路径 ────────────────────────────────────────────────────────────
# 代码里不写死绝对路径（AGENTS.md 硬约束 6），只 expanduser / expandvars。
# 改了这两项就改变插件看哪里；换机器或换 Agent 安装位置时只动这里。
[agent_deskmate.watch]
# Claude Code 转录目录（**/*.jsonl，一行一条记录）
claude_projects_dir = "~/.claude/projects"
# cc-switch 网关账本（SQLite，proxy_request_logs 表，只读打开）
cc_switch_db = "~/.cc-switch/cc-switch.db"

# ── 归因逃生口 ─────────────────────────────────────────────────────────────
# 你亲自在这些目录下开过的会话。cwd 落在里面的，播报主语写成
# 「你自己开的 Claude Code」；不在里面的，critical 一律写成「发起者未知」。
#
# 为什么需要它：插件看不出一个 claude 进程是你手开的、还是被别的程序
# spawn 的（真实事故：DSH spawn 的 claude -p 删了文件，播报被读成
# "我什么时候让 Claude 删东西了"）。进程树不能当依据——Windows 上父进程
# 可能已退出、中间常隔一层 shell/node。
# 所以这里要**你自己声明**：这是用户给的事实，不是插件的猜测。
# 不声明 = 全部按未知处理（宁可少说，不错说）。
# 留空时插件启动会在日志里打一条提示（只在日志，不播报）。
[agent_deskmate.mine]
roots = []
# 示例（TOML 里反斜杠要转义，写两个）：
# roots = ["D:\\workspace", "C:\\Users\\alpha\\projects"]
# 也可以直接用正斜杠，Windows 同样认：
# roots = ["D:/workspace", "C:/Users/alpha/projects"]

# ── 审批中继（三层门控，规格《审批自动化-授权层级》§5） ─────────────────────
# L0 转发：无任何配置即可用——只转发审批、常驻提醒未决，不解释不判断。
# L1 建议：ai_judgement=true **且** api_key 非空才可用；否则卡片上写
#          「未配置 key，无法给出建议」，不假装成功、不静默降级。
# L2 自动：L1 两条 + auto_decide="low_risk_only" + 风险 ≤ 阈值才生效；
#          删除类/危险写**永远不进 L2**，无论阈值怎么设。
# 任何一层都不能跳级：L2 必须建立在 L1 之上——没解释能力的自动决定是黑箱代办。
#
# **插件永不代替用户做判断**：到期只把 pending 标 expired，不发任何决定；
# 真正拦住调用的是宿主自己的 onFailure:"block" 策略，不是我们的判断。
[agent_deskmate.approval]
# 本地 HTTP 服务监听端口，只绑 127.0.0.1。改它必须同步改 hooks.json 里的 url，
# 两边不一致时启动会打错误日志（否则症状是"插件没反应"，能查一小时）。
port = 48921

# 到期标记（秒）。默认 570 = hook 600s 前留 30s 余量。
# **只标记 expired，不发任何 decision**——不自动允许、不自动拒绝。
timeout_mark_expired = 570

# 到期记录的保留时长（秒）。过期不删，保留这段时间供 pending_list 事后查。
retention_seconds = 3600

# L1：填了 api_key 之后，由用户显式打开。默认关。
# 只能由用户手写，插件不会在运行时自动打开它。
ai_judgement = false

# L2："off" | "low_risk_only"。默认 off。
# 同样只能由用户手写。
auto_decide = "off"

# L2 风险阈值：info | notice | warn | critical。超出即回落为 L1（只建议不代决）。
auto_decide_max_severity = "notice"

# 模型用的 key（5b 接入后才会被真正使用）。只用来判断"有没有 key"，
# **不写日志、不进卡片、不给模型看**。
api_key = ""
